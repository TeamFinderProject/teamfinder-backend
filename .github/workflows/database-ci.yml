name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teamfinder
          POSTGRES_USER: teamfinder
          POSTGRES_PASSWORD: teamfinder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamfinder -d teamfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__TeamFinder: Host=localhost;Port=5432;Database=teamfinder;Username=teamfinder;Password=teamfinder_ci
      TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=teamfinder_tests;Username=teamfinder;Password=teamfinder_ci
      Jwt__SigningKey: ci-only-signing-key-0123456789-0123456789
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: teamfinder
      PGUSER: teamfinder
      PGPASSWORD: teamfinder_ci
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Восстановить зависимости
        run: dotnet restore TeamFinder.slnx

      - name: Собрать
        run: dotnet build TeamFinder.slnx --configuration Release --no-restore

      - name: Установить EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Проверить, что миграции соответствуют модели
        # Падает, если сущности изменили, а миграцию не добавили.
        run: dotnet ef migrations has-pending-model-changes --project src/TeamFinder.Api --startup-project src/TeamFinder.Api --configuration Release --no-build

      - name: Применить миграции к пустой базе
        run: dotnet ef database update --project src/TeamFinder.Api --startup-project src/TeamFinder.Api --configuration Release --no-build

      - name: Проверить таблицы и справочники
        run: |
          sudo apt-get update -qq && sudo apt-get install --yes -qq postgresql-client
          test "$(psql -tAc 'SELECT COUNT(*) FROM skills')" -eq 18
          test "$(psql -tAc 'SELECT COUNT(*) FROM role_types')" -eq 8
          test "$(psql -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users','profiles','skills','role_types','user_skills','user_role_interests','projects','project_roles','role_skill_requirements','applications','memberships','refresh_tokens','notifications','telegram_links','telegram_link_codes')")" -eq 15
          echo "Схема из миграций создана, справочники заполнены."

      - name: Тесты бизнес-правил (API + PostgreSQL)
        run: dotnet test TeamFinder.slnx --configuration Release --no-build --logger "console;verbosity=normal"
